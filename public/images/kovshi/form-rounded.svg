  <style>.title{font:700 23px Montserrat,Arial,sans-serif;fill:#052f55;letter-spacing:1px}.small{font:500 15px Montserrat,Arial,sans-serif;fill:#52677d}.label{font:600 18px Montserrat,Arial,sans-serif;fill:#052f55}.shape{fill:#eef5fb;stroke:#052f55;stroke-width:5;stroke-linejoin:round}.accent{fill:none;stroke:#f5c518;stroke-width:7;stroke-linejoin:round}.dim{fill:none;stroke:#0757a4;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}</style>
