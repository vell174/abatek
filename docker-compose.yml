services:
  traefik:
    image: traefik:v3.7.10
    container_name: abatek-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt

  app:
    build: .
    container_name: abatek-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NUXT_DATABASE_URL=postgres://${POSTGRES_USER:-abatek}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-abatek}
      - NUXT_SMTP_HOST=mailserver
      - NUXT_SMTP_PORT=25
      - NUXT_MAIL_FROM=${MAIL_FROM:-site@${SITE_DOMAIN}}
      - NUXT_MAIL_TO=${MAIL_TO:-zakaz@${SITE_DOMAIN}}
      - NUXT_SITE_DOMAIN=${SITE_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.abatek.rule=Host(`${SITE_DOMAIN}`) || Host(`www.${SITE_DOMAIN}`)
      - traefik.http.routers.abatek.entrypoints=websecure
      - traefik.http.routers.abatek.tls.certresolver=le
      - traefik.http.routers.abatek.middlewares=abatek-auth@docker,abatek-compress@docker
      - traefik.http.middlewares.abatek-auth.basicauth.users=1111:{SHA}ARyUXzDOLLr8RS85hA8CVpMznEI=
      - traefik.http.middlewares.abatek-compress.compress=true
      - traefik.http.services.abatek.loadbalancer.server.port=3000
      - traefik.http.routers.abatek.tls.domains[0].main=${SITE_DOMAIN}
      - traefik.http.routers.abatek.tls.domains[0].sans=www.${SITE_DOMAIN},mail.${SITE_DOMAIN}
      - traefik.http.routers.abatek-autoconfig.rule=Host(`autoconfig.${SITE_DOMAIN}`) && Path(`/mail/config-v1.1.xml`)
      - traefik.http.routers.abatek-autoconfig.entrypoints=websecure
      - traefik.http.routers.abatek-autoconfig.tls.certresolver=le
      - traefik.http.routers.abatek-autoconfig.middlewares=abatek-compress@docker
      - traefik.http.routers.abatek-autoconfig.service=abatek
      - traefik.http.routers.abatek-mail-assets.rule=Host(`${SITE_DOMAIN}`) && PathPrefix(`/mail/`)
      - traefik.http.routers.abatek-mail-assets.priority=100
      - traefik.http.routers.abatek-mail-assets.entrypoints=websecure
      - traefik.http.routers.abatek-mail-assets.tls.certresolver=le
      - traefik.http.routers.abatek-mail-assets.middlewares=abatek-compress@docker
      - traefik.http.routers.abatek-mail-assets.service=abatek
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    container_name: abatek-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-abatek}
      - POSTGRES_USER=${POSTGRES_USER:-abatek}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-abatek} -d ${POSTGRES_DB:-abatek}']
      interval: 10s
      timeout: 5s
      retries: 5

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:15
    container_name: abatek-mailserver
    hostname: mail.${SITE_DOMAIN}
    restart: unless-stopped
    ports:
      - '25:25' # SMTP (приём почты между серверами)
      - '465:465' # SMTPS (отправка из почтовых клиентов)
      - '587:587' # Submission
      - '993:993' # IMAPS (чтение zakaz@ из клиента)
    environment:
    # ==========================================================
    # ОСНОВНОЕ
    # ==========================================================

    - POSTMASTER_ADDRESS=${MAIL_ADMIN:-admin@${SITE_DOMAIN}}

    # Локальные аккаунты DMS
    - ACCOUNT_PROVISIONER=FILE

    # IMAP нужен
    - ENABLE_IMAP=1

    # POP3 не нужен
    - ENABLE_POP3=0

    # Максимальный размер письма ~25 MiB
    - POSTFIX_MESSAGE_SIZE_LIMIT=26214400

    # Отдельного ограничения mailbox через Postfix нет
    - POSTFIX_MAILBOX_SIZE_LIMIT=0

    # Квоты Dovecot.
    # Можно оставить включенными — накладные расходы небольшие.
    - ENABLE_QUOTAS=1


    # ==========================================================
    # APP -> SMTP
    # ==========================================================

    # app -> mailserver:25 без SMTP AUTH
    - PERMIT_DOCKER=connected-networks


    # ==========================================================
    # TLS
    # ==========================================================

    - SSL_TYPE=letsencrypt
    - SSL_DOMAIN=mail.${SITE_DOMAIN}

    # Современный TLS
    - TLS_LEVEL=modern


    # ==========================================================
    # IPv4
    # ==========================================================

    # Если IPv6 для почты не настроен — правильно ограничить IPv4
    - POSTFIX_INET_PROTOCOLS=ipv4
    - DOVECOT_INET_PROTOCOLS=ipv4


    # ==========================================================
    # FAIL2BAN
    # ==========================================================

    - ENABLE_FAIL2BAN=1
    - FAIL2BAN_BLOCKTYPE=drop


    # ==========================================================
    # АНТИСПАМ — ТЯЖЁЛЫЕ КОМПОНЕНТЫ ВЫКЛЮЧЕНЫ
    # ==========================================================

    # Rspamd выключаем полностью.
    # Следовательно Redis вообще не запускается.
    - ENABLE_RSPAMD=0

    # Можно указать явно, хотя при Rspamd=0 это уже не требуется.
    - ENABLE_RSPAMD_REDIS=0

    # ClamAV очень прожорлив по RAM — обязательно 0 на слабом VPS
    - ENABLE_CLAMAV=0

    # SpamAssassin тоже не используем
    - ENABLE_SPAMASSASSIN=0

    # Amavis не нужен без SpamAssassin / ClamAV
    - ENABLE_AMAVIS=0


    # ==========================================================
    # DKIM / DMARC / SPF
    #
    # ВАЖНО:
    # При выключенном Rspamd возвращаем legacy-компоненты,
    # потому что именно они теперь делают DKIM/DMARC/SPF.
    # ==========================================================

    # DKIM-подпись исходящих писем
    - ENABLE_OPENDKIM=1

    # Проверка DMARC входящих писем
    - ENABLE_OPENDMARC=1

    # SPF-проверка входящих
    - ENABLE_POLICYD_SPF=1


    # ==========================================================
    # GREYLISTING
    # ==========================================================

    # Postgrey лёгкий по ресурсам.
    #
    # 0 = выключить
    # 1 = включить
    #
    # Минус: первое письмо от нового отправителя иногда
    # приходит с задержкой в несколько минут.
    #
    - ENABLE_POSTGREY=0


    # ==========================================================
    # DNS BLOCK LISTS
    # ==========================================================

    # Тоже практически не потребляет RAM.
    #
    # Но это более агрессивная фильтрация:
    # письмо может быть отвергнуто ещё до доставки.
    #
    # Я бы сначала оставил выключенным.
    - ENABLE_DNSBL=0


    # ==========================================================
    # POSTSCREEN
    # ==========================================================

    # Лёгкая SMTP-защита Postfix
    - POSTSCREEN_ACTION=enforce

    # Не делать слишком жёсткую проверку reverse hostname
    - POSTFIX_REJECT_UNKNOWN_CLIENT_HOSTNAME=0


    # ==========================================================
    # SMTP AUTH SECURITY
    # ==========================================================

    # Пользователь не сможет отправить письмо
    # с произвольным поддельным From
    - SPOOF_PROTECTION=1


    # ==========================================================
    # SRS
    # ==========================================================

    # Не нужен, пока сервер не используется как forwarder
    - ENABLE_SRS=0


    # ==========================================================
    # MTA-STS
    # ==========================================================

    # Можно оставить выключенным
    - ENABLE_MTA_STS=0


    # ==========================================================
    # MANAGESIEVE
    # ==========================================================

    # Не запускать дополнительный ManageSieve listener.
    #
    # Сам серверный Sieve при необходимости можно
    # настроить отдельно.
    #
    # - ENABLE_MANAGESIEVE=1


    # ==========================================================
    # REPORTS
    # ==========================================================

    # Не включаем ежедневные отчеты
    # - PFLOGSUMM_TRIGGER=daily_cron
    # - LOGWATCH_INTERVAL=daily


    # ==========================================================
    # UPDATE CHECK
    # ==========================================================

    # Это почти ничего не потребляет.
    # Но если хотите максимально убрать лишнее:
    - ENABLE_UPDATE_CHECK=0


    # ==========================================================
    # LOG ROTATION
    # ==========================================================

    - LOGROTATE_INTERVAL=weekly
    - LOGROTATE_COUNT=4

    cap_add:
      - NET_ADMIN

    volumes:
      - dms-mail-data:/var/mail
      - dms-mail-state:/var/mail-state
      - dms-mail-logs:/var/log/mail
      - dms-config:/tmp/docker-mailserver

      # Русские системные IMAP-папки вместо стандартных английских
      - ./dovecot/15-mailboxes.conf:/etc/dovecot/conf.d/15-mailboxes.conf:ro

      # общий ACME volume с Traefik
      - traefik-letsencrypt:/etc/letsencrypt

      - /etc/localtime:/etc/localtime:ro

    healthcheck:
      test: [ 'CMD-SHELL', 'ss -lntp | grep -q ":25"' ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  traefik-letsencrypt:
  pgdata:
  dms-mail-data:
  dms-mail-state:
  dms-mail-logs:
  dms-config:
